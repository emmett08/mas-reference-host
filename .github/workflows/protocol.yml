name: Pinned protocol verification
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/protocol
      - name: Install pinned Rust and SPIN
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y spin
      - name: Verify the exact external protocol
        run: |
          cargo +1.99.0 test --locked --manifest-path .protocol/rust-protocol/Cargo.toml
          cargo +1.99.0 build --locked --release --manifest-path .protocol/rust-protocol/Cargo.toml
          .protocol/rust-protocol/target/release/verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-protocol-evidence
          path: .protocol/formal/evidence
