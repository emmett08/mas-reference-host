name: Portable client checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      reference_host_ref:
        type: string
        required: false
        default: ''
      protocol_ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emmett08/mas-reference-host
          ref: ${{ inputs.reference_host_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/protocol
        with:
          revision: ${{ inputs.protocol_ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install exact locked build tools and client
        run: |
          python -m pip install --require-hashes -r host/requirements-build.txt
          python -m pip install --no-deps --no-build-isolation ./host
      - name: Run native HTTP client and command-line conformance
        run: python -m unittest discover -s host/tests -p test_portable_client.py -v
