# Explicit opt-in to Cursor calls. Export CURSOR_API_KEY and both model names.
# docker compose -f compose.yaml -f compose.cursor.yaml run --build --rm mesh
services:
  mesh:
    image: mas-mesh-cursor:local
    build:
      dockerfile: Dockerfile.cursor
    read_only: false # Required by Compose's environment-backed secret mount.
    cpus: "2.0"
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    tmpfs: !override
      - /tmp:mode=1777,size=128m
    environment:
      MAS_MODE: cursor
      MAS_CURSOR_TRANSPORT: ${MAS_CURSOR_TRANSPORT:-sdk-default}
      MAS_PLANNER_PROVIDER: cursor
      MAS_REVIEWER_PROVIDER: cursor
      MAS_PLANNER_MODEL: ${MAS_PLANNER_MODEL:?Set a Cursor model available to your account}
      MAS_REVIEWER_MODEL: ${MAS_REVIEWER_MODEL:?Set a Cursor model available to your account}
      MAS_CALL_RESERVATION_MICROUSD: ${MAS_CALL_RESERVATION_MICROUSD:-100000}
      MAS_PLANNER_RESERVATION_MICROUSD: ${MAS_PLANNER_RESERVATION_MICROUSD:-${MAS_CALL_RESERVATION_MICROUSD:-100000}}
      MAS_REVIEWER_RESERVATION_MICROUSD: ${MAS_REVIEWER_RESERVATION_MICROUSD:-${MAS_CALL_RESERVATION_MICROUSD:-100000}}
      CURSOR_API_KEY_FILE: /run/secrets/cursor_api_key
    secrets:
      - source: cursor_api_key
        target: cursor_api_key
        uid: "10001"
        gid: "10001"
        mode: 0400

secrets:
  cursor_api_key:
    environment: CURSOR_API_KEY
