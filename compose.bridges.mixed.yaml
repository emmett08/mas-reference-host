x-live: &live
  image: mas-mesh-cursor:local
  build:
    context: .
    dockerfile: Dockerfile.cursor
  read_only: false
  cpus: "2.0"
  mem_limit: 1g
  memswap_limit: 1g
  pids_limit: 128
  environment:
    MAS_CURSOR_TRANSPORT: ${MAS_CURSOR_TRANSPORT:-sdk-default}
    MAS_PLANNER_PROVIDER: cursor
    MAS_PLANNER_MODEL: ${MAS_PLANNER_MODEL:?set an account-supported Cursor model}
    MAS_REVIEWER_PROVIDER: openai
    MAS_REVIEWER_MODEL: ${MAS_REVIEWER_MODEL:-gpt-4o-mini}
    CURSOR_API_KEY_FILE: /run/secrets/cursor_api_key
    OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
services:
  bridge:
    <<: *live
    command: [bridge, serve, --bind, "0.0.0.0", --port, "8765", --allow-loopback-http, --config, /app/examples/bridges/mixed.json, --state-dir, /state]
    secrets:
      - {source: bridge_credentials, target: bridge_credentials, uid: "10001", gid: "10001", mode: 0400}
      - {source: cursor_api_key, target: cursor_api_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: openai_api_key, target: openai_api_key, uid: "10001", gid: "10001", mode: 0400}
  worker:
    <<: *live
    command: [bridge, worker, --config, /app/examples/bridges/mixed.json, --state-dir, /state]
    secrets:
      - {source: cursor_api_key, target: cursor_api_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: openai_api_key, target: openai_api_key, uid: "10001", gid: "10001", mode: 0400}
secrets:
  cursor_api_key:
    environment: CURSOR_API_KEY
  openai_api_key:
    environment: OPENAI_API_KEY
